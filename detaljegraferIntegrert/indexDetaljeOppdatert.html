<body>

    <!-- Headeren er toppen av nettsiden -->
<header class="site-header">

  <!-- Venstre del av headeren med logo og tekst -->

     <img src="/images2/logobilde2.png" alt="KommuneKompasset logo" class="logo" />

    <!-- Teksten ved siden av logoen -->

      <h1>KommuneKompasset</h1>

    </div>
  </div>

  <!-- Navigasjonsmenyen til høyre i headeren -->
  <nav class="nav-menu">
    <a href="/designkart.html" class="nav-link">Hjem</a>

  </nav>

    <header>

    <section class="ai-button-section">
      <button id="ai-button" class="ai-btn">KI Oppsummering</button>
    </section>

    <div class="topbar">
        <div class="select-wrapper">
            <select id="kommuneSelect"></select>
            <br>
            <br>    
            <p>Sist oppdatert: <b>Mai 2026</b></p>
        </div>
    </div>

<div id="loader">Laster...</div>

    <div class="assessment">

        <div class="assess green" id="bra"></div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="AI-container">
      <div class="ai-header">
        <img src="images/ai-pic.png" alt="AI Illustration" class="ai-illustration"/>

</main>


<!-- Footeren er bunnen av nettsiden -->
<footer class="site-footer">

  <!-- Midtstilt innhold i footeren -->
  <div class="footer-center">

    <!-- Logo og navn i footeren -->
    <div class="footer-brand">
      <span>KommuneKompasset</span>

    <!-- Gruppeinformasjon -->
