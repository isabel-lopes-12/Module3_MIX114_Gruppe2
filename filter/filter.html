<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="filter.css">
</head>
<body>
    <div class="filter-panel">
  <h3>Filtrer etter tema</h3>

  <div class="filter-search">
    <span>🔍</span>
    <input type="text" id="filterSearch" placeholder="Søk etter tema..." />
  </div>

  <div class="filter-list" id="filterList"></div>

  <div class="filter-buttons">
    <button id="showAboveBtn">Vis over snitt</button>
    <button id="showBelowBtn">Vis under snitt</button>
    <button id="resetBtn">Nullstill</button>
  </div>
</div>
  <script src="filter.js"></script>


</body>
</html>
